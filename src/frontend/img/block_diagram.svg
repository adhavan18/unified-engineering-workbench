<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="600" fill="#111827">host-connected embedded workbench: block diagram</text>
  <text x="24" y="52" fill="#4b5563">solid = data/debug link · dashed = power · grey band = common ground reference (single star point at the hub)</text>

  <!-- host -->
  <rect x="300" y="72" width="360" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-weight="600" fill="#1e3a8a">host pc (windows 11 x64)</text>
  <text x="480" y="116" text-anchor="middle" fill="#1f2937">workbench app → device registry → adapters</text>
  <text x="480" y="134" text-anchor="middle" fill="#1f2937">mcu adapter (serial) · fpga adapter (serial) · jtag adapter (vendor usb)</text>
  <text x="480" y="160" text-anchor="middle" fill="#6b7280" font-size="12">in this prototype every adapter is a c++ mock (simulated)</text>

  <!-- hub -->
  <rect x="380" y="206" width="200" height="46" rx="8" fill="#f9fafb" stroke="#6b7280"/>
  <text x="480" y="226" text-anchor="middle" font-weight="600">powered usb 2.0 hub</text>
  <text x="480" y="242" text-anchor="middle" fill="#4b5563" font-size="12">5 V, per-port current limit, ground star</text>
  <line x1="480" y1="176" x2="480" y2="206" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="488" y="196" fill="#374151" font-size="12">usb</text>

  <!-- boards -->
  <rect x="24" y="320" width="260" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="154" y="344" text-anchor="middle" font-weight="600" fill="#14532d">mcu board (stm32f4-class)</text>
  <text x="40" y="368" fill="#1f2937">usb cdc-acm virtual com port</text>
  <text x="40" y="386" fill="#1f2937">i/o domain: 3.3 V lvcmos</text>
  <text x="40" y="404" fill="#1f2937">5 V usb → on-board ldo → 3.3 V</text>
  <text x="40" y="422" fill="#1f2937">swd/jtag: 10-pin 1.27 mm cortex debug</text>
  <text x="40" y="440" fill="#1f2937">on-board probe isolated (jumpers off)</text>
  <text x="40" y="458" fill="#1f2937">  when an external probe is used</text>
  <text x="40" y="478" fill="#6b7280" font-size="12">runs firmware: a compute target</text>

  <rect x="350" y="320" width="260" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="480" y="344" text-anchor="middle" font-weight="600" fill="#7c2d12">fpga board (artix-7-class)</text>
  <text x="366" y="368" fill="#1f2937">usb-uart bridge (ftdi-class)</text>
  <text x="366" y="386" fill="#1f2937">vccint 1.0 V · vccaux 1.8 V</text>
  <text x="366" y="404" fill="#1f2937">vcco per bank: 3.3 V or 1.8 V</text>
  <text x="366" y="422" fill="#1f2937">jtag: 14-pin 2 mm header, vref = 3.3 V</text>
  <text x="366" y="440" fill="#1f2937">external 5 V / 2 A supply</text>
  <text x="366" y="458" fill="#1f2937">  (not hub-powered)</text>
  <text x="366" y="478" fill="#6b7280" font-size="12">runs a bitstream: a compute target</text>

  <rect x="676" y="320" width="260" height="170" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="806" y="344" text-anchor="middle" font-weight="600" fill="#4c1d95">jtag adapter (ft2232h-class)</text>
  <text x="692" y="368" fill="#1f2937">usb 2.0 hs, vendor protocol</text>
  <text x="692" y="386" fill="#1f2937">drives tck, tms, tdi (+ ntrst)</text>
  <text x="692" y="404" fill="#1f2937">samples tdo from the target</text>
  <text x="692" y="422" fill="#1f2937">i/o level follows target vref</text>
  <text x="692" y="440" fill="#1f2937">(1.2–3.3 V), never drives vref</text>
  <text x="692" y="458" fill="#1f2937">bus-powered from the hub</text>
  <text x="692" y="478" fill="#6b7280" font-size="12">debug interface only: runs no workloads</text>

  <!-- usb links -->
  <path d="M420 252 L154 320" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="282" fill="#374151" font-size="12">usb (data + 5 V)</text>
  <line x1="480" y1="252" x2="480" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="488" y="292" fill="#374151" font-size="12">usb (data only)</text>
  <path d="M540 252 L806 320" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="660" y="282" fill="#374151" font-size="12">usb (data + 5 V)</text>

  <!-- jtag to fpga -->
  <path d="M676 410 L610 410" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="618" y="402" fill="#5b21b6" font-size="12" font-weight="600">jtag</text>
  <!-- optional swd to mcu -->
  <path d="M806 490 L806 528 L154 528 L154 490" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <text x="300" y="522" fill="#5b21b6" font-size="12">optional swd to mcu: same probe, one target tap at a time, needs a 10-pin adapter cable</text>

  <!-- mcu fpga link -->
  <path d="M284 452 L350 452" fill="none" stroke="#374151" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="252" y="510" fill="#374151" font-size="12"></text>
  <text x="290" y="446" fill="#374151" font-size="11">uart</text>
  <text x="286" y="470" fill="#b45309" font-size="11">3.3 V bank only,</text>
  <text x="286" y="483" fill="#b45309" font-size="11">else level shifter</text>

  <!-- power -->
  <rect x="350" y="548" width="260" height="34" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="480" y="570" text-anchor="middle" fill="#713f12">5 V / 2 A bench supply → fpga board</text>
  <line x1="480" y1="548" x2="480" y2="490" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- ground band -->
  <rect x="24" y="500" width="912" height="8" fill="#e5e7eb"/>
  <text x="30" y="596" fill="#6b7280" font-size="12">all boards share one ground: hub ground ↔ fpga supply negative tied at a single point before any signal cable is connected</text>
</svg>
